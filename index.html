<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marechal Lott | Analytics Pro</title>
    <style>
        :root {
            --bg-color: #121417;
            --card-bg: #1c1f24;
            --accent-green: #00cba9;
            --text-main: #ffffff;
            --text-dim: #94a3b8;
            --gold: #f59e0b;
            --glass: rgba(255, 255, 255, 0.03);
            --overall-gradient: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            background: var(--card-bg);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.7);
            border: 1px solid rgba(255,255,255,0.05);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: #25282e;
            padding: 40px;
            border-radius: 20px;
            width: 380px;
            text-align: center;
            border: 1px solid var(--accent-green);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .btn-main {
            background: var(--accent-green);
            color: #000;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-danger {
            background: #ff4d4d;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .tabs-container {
            display: flex;
            gap: 12px;
            margin-bottom: 30px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 15px;
            overflow-x: auto;
        }

        .tab {
            padding: 10px 20px;
            border-radius: 30px;
            background: var(--glass);
            cursor: pointer;
            font-size: 0.9rem;
            color: var(--text-dim);
            white-space: nowrap;
        }

        .tab.active {
            background: var(--gold);
            color: #000;
            font-weight: bold;
        }

        /* Summary Sections */
        .overall-summary {
            background: var(--overall-gradient);
            padding: 25px;
            border-radius: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,215,0,0.2);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .overall-summary h3 {
            margin-top: 0;
            font-size: 0.85rem;
            letter-spacing: 2px;
            color: var(--gold);
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 40px;
        }

        .summary-card {
            background: linear-gradient(145deg, rgba(255,255,255,0.05), rgba(255,255,255,0.01));
            padding: 20px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .summary-card h4 {
            margin: 0 0 15px 0;
            color: var(--text-dim);
            text-transform: uppercase;
            font-size: 0.75rem;
        }

        .summary-stats {
            display: flex;
            justify-content: space-between;
        }

        .stat-item { text-align: center; flex: 1; }
        .stat-item span { display: block; font-size: 0.65rem; color: var(--text-dim); margin-bottom: 4px; }
        .stat-item b { font-size: 1.4rem; color: #fff; }

        .form-section {
            background: var(--glass);
            padding: 20px;
            border-radius: 16px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 10px;
            margin-bottom: 30px;
        }

        input {
            background: #2a2e35;
            border: 1px solid #3f444e;
            color: #fff;
            padding: 10px;
            border-radius: 8px;
        }

        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; color: var(--text-dim); font-size: 0.75rem; padding: 15px; border-bottom: 2px solid #333; }
        td { padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.9rem; }

        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1 id="pName">Portal do Atleta</h1>
            <p id="pDetails" style="color: var(--text-dim)">Carregando dados...</p>
        </div>
        <div style="display: flex; gap: 10px;">
            <button class="btn-main" id="btnInit" onclick="showModal('modalPlayer')">CADASTRAR JOGADOR</button>
            <button class="btn-main hidden" id="btnSeason" onclick="showModal('modalSeason')">+ NOVA TEMPORADA</button>
            <button class="btn-danger" onclick="resetAll()">LIMPAR TUDO</button>
        </div>
    </header>

    <div id="dashboard" class="hidden">
        <div class="tabs-container" id="seasonTabs"></div>

        <!-- RESUMO GERAL DA TEMPORADA ATIVA -->
        <div class="overall-summary">
            <h3>TOTAL DA TEMPORADA ATIVA</h3>
            <div class="summary-stats" id="overallStats">
                <div class="stat-item"><span>JOGOS</span><b id="ovGames">0</b></div>
                <div class="stat-item"><span>GOLS</span><b id="ovGoals">0</b></div>
                <div class="stat-item"><span>ASSISTÊNCIAS</span><b id="ovAssists">0</b></div>
                <div class="stat-item"><span>PARTICIPAÇÕES</span><b id="ovTotal">0</b></div>
            </div>
        </div>

        <h3 style="color: var(--text-dim); font-size: 0.8rem; margin-bottom: 15px; letter-spacing: 1px;">POR COMPETIÇÃO</h3>
        <div class="summary-grid" id="summaryGrid"></div>

        <div class="form-section">
            <input type="date" id="mDate">
            <input type="text" id="mT1" placeholder="Time Casa">
            <input type="text" id="mT2" placeholder="Time Fora">
            <input type="text" id="mScore" placeholder="Placar">
            <input type="text" id="mComp" placeholder="Competição">
            <input type="number" id="mG" placeholder="Gols">
            <input type="number" id="mA" placeholder="Assists">
            <button class="btn-main" onclick="saveMatch()">SALVAR JOGO</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>DATA</th>
                    <th>COMPETIÇÃO</th>
                    <th>CONFRONTO</th>
                    <th>RESULTADO</th>
                    <th>GOLS</th>
                    <th>AST</th>
                </tr>
            </thead>
            <tbody id="matchTable"></tbody>
        </table>
    </div>
</div>

<!-- Modais -->
<div id="modalPlayer" class="modal">
    <div class="modal-content">
        <h2>Novo Atleta</h2>
        <input type="text" id="inName" placeholder="Nome do Jogador" style="width:90%; margin-bottom:15px;">
        <input type="date" id="inBirth" style="width:90%; margin-bottom:20px;">
        <button class="btn-main" style="width:100%" onclick="initPlayer()">GRAVAR PERFIL</button>
    </div>
</div>

<div id="modalSeason" class="modal">
    <div class="modal-content">
        <h2>Nova Temporada</h2>
        <input type="text" id="inSeason" placeholder="Ex: 2026 - Marechal Lott" style="width:90%; margin-bottom:20px;">
        <button class="btn-main" style="width:100%" onclick="initSeason()">CRIAR</button>
    </div>
</div>

<script>
    let db = { player: null, seasons: {}, active: null };

    window.onload = function() {
        const saved = localStorage.getItem('marechal_lott_data');
        if (saved) {
            db = JSON.parse(saved);
            if (db.player) {
                renderPlayerHeader();
                document.getElementById('btnInit').classList.add('hidden');
                document.getElementById('btnSeason').classList.remove('hidden');
                document.getElementById('dashboard').classList.remove('hidden');
                updateUI();
            }
        } else {
            document.getElementById('pDetails').innerText = "Aguardando registro inicial...";
        }
    };

    function saveToLocalStorage() { localStorage.setItem('marechal_lott_data', JSON.stringify(db)); }
    function showModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal() { document.querySelectorAll('.modal').forEach(m => m.style.display = 'none'); }

    function initPlayer() {
        const name = document.getElementById('inName').value;
        const birth = document.getElementById('inBirth').value;
        if(!name || !birth) return;
        db.player = { name, birth };
        renderPlayerHeader();
        document.getElementById('btnInit').classList.add('hidden');
        document.getElementById('btnSeason').classList.remove('hidden');
        document.getElementById('dashboard').classList.remove('hidden');
        saveToLocalStorage();
        closeModal();
    }

    function renderPlayerHeader() {
        document.getElementById('pName').innerText = db.player.name;
        const year = db.player.birth.split('-')[0];
        document.getElementById('pDetails').innerText = `Nascido em ${year}`;
    }

    function initSeason() {
        const sName = document.getElementById('inSeason').value;
        if(!sName || db.seasons[sName]) return;
        db.seasons[sName] = [];
        db.active = sName;
        updateUI();
        saveToLocalStorage();
        closeModal();
    }

    function saveMatch() {
        if(!db.active) return;
        const match = {
            date: document.getElementById('mDate').value,
            t1: document.getElementById('mT1').value,
            t2: document.getElementById('mT2').value,
            score: document.getElementById('mScore').value,
            comp: document.getElementById('mComp').value.toUpperCase(),
            g: parseInt(document.getElementById('mG').value) || 0,
            a: parseInt(document.getElementById('mA').value) || 0
        };
        db.seasons[db.active].push(match);
        updateUI();
        saveToLocalStorage();
        document.querySelectorAll('.form-section input').forEach(i => i.value = '');
    }

    function updateUI() {
        renderTabs();
        renderOverall();
        renderSummary();
        renderTable();
    }

    function renderTabs() {
        const container = document.getElementById('seasonTabs');
        container.innerHTML = '';
        Object.keys(db.seasons).forEach(s => {
            const btn = document.createElement('div');
            btn.className = `tab ${s === db.active ? 'active' : ''}`;
            btn.innerText = s;
            btn.onclick = () => { db.active = s; updateUI(); saveToLocalStorage(); };
            container.appendChild(btn);
        });
    }

    function renderOverall() {
        if(!db.active || !db.seasons[db.active]) return;
        let tJ = 0, tG = 0, tA = 0;
        db.seasons[db.active].forEach(m => {
            tJ++; tG += m.g; tA += m.a;
        });
        document.getElementById('ovGames').innerText = tJ;
        document.getElementById('ovGoals').innerText = tG;
        document.getElementById('ovAssists').innerText = tA;
        document.getElementById('ovTotal').innerText = tG + tA;
    }

    function renderSummary() {
        const grid = document.getElementById('summaryGrid');
        grid.innerHTML = '';
        if(!db.active) return;
        const summary = {};
        db.seasons[db.active].forEach(m => {
            if(!summary[m.comp]) summary[m.comp] = { j: 0, g: 0, a: 0 };
            summary[m.comp].j++; summary[m.comp].g += m.g; summary[m.comp].a += m.a;
        });
        Object.keys(summary).forEach(comp => {
            grid.innerHTML += `
                <div class="summary-card">
                    <h4>${comp}</h4>
                    <div class="summary-stats">
                        <div class="stat-item"><span>J</span><b>${summary[comp].j}</b></div>
                        <div class="stat-item"><span>G</span><b>${summary[comp].g}</b></div>
                        <div class="stat-item"><span>A</span><b>${summary[comp].a}</b></div>
                    </div>
                </div>`;
        });
    }

    function renderTable() {
        const body = document.getElementById('matchTable');
        body.innerHTML = '';
        if(!db.active) return;
        db.seasons[db.active].slice().reverse().forEach(m => {
            body.innerHTML += `<tr>
                <td>${m.date}</td>
                <td style="color:var(--gold)">${m.comp}</td>
                <td>${m.t1} vs ${m.t2}</td>
                <td>${m.score}</td>
                <td style="font-weight:bold">${m.g}</td>
                <td style="font-weight:bold">${m.a}</td>
            </tr>`;
        });
    }

    function resetAll() {
        if(confirm("Deseja apagar tudo?")) {
            localStorage.removeItem('marechal_lott_data');
            location.reload();
        }
    }
</script>
</body>
</html>
