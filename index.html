<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marechal Lott | Multi-Player Pro</title>
    <style>
        :root {
            --bg-color: #0f1113;
            --card-bg: #1c1f24;
            --accent-green: #00cba9;
            --text-main: #ffffff;
            --text-dim: #94a3b8;
            --gold: #f59e0b;
            --glass: rgba(255, 255, 255, 0.03);
            --overall-gradient: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            background: var(--card-bg);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.7);
            border: 1px solid rgba(255,255,255,0.05);
        }

        /* Modals */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.92);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: #25282e;
            padding: 40px;
            border-radius: 20px;
            width: 400px;
            text-align: center;
            border: 1px solid var(--accent-green);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .btn-main {
            background: var(--accent-green);
            color: #000;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-main:hover { transform: translateY(-2px); opacity: 0.9; }

        /* Lista de Jogadores Sidebar/Top */
        .player-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            overflow-x: auto;
            padding: 5px;
        }

        .player-chip {
            background: var(--glass);
            padding: 12px 20px;
            border-radius: 15px;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.1);
            transition: 0.3s;
            min-width: 120px;
            text-align: center;
        }

        .player-chip.active {
            border-color: var(--accent-green);
            background: rgba(0, 203, 169, 0.1);
        }

        .player-chip h4 { margin: 0; font-size: 0.9rem; }
        .player-chip span { font-size: 0.7rem; color: var(--text-dim); }

        /* Dash Elements */
        .overall-summary {
            background: var(--overall-gradient);
            padding: 25px;
            border-radius: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,215,0,0.1);
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .summary-card {
            background: rgba(255,255,255,0.03);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .form-section {
            background: var(--glass);
            padding: 20px;
            border-radius: 16px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 10px;
            margin-bottom: 30px;
        }

        input {
            background: #2a2e35;
            border: 1px solid #3f444e;
            color: #fff;
            padding: 12px;
            border-radius: 8px;
            width: 100%;
            box-sizing: border-box;
        }

        .tabs-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab {
            padding: 8px 18px;
            border-radius: 20px;
            background: var(--glass);
            cursor: pointer;
            font-size: 0.85rem;
        }

        .tab.active { background: var(--gold); color: #000; font-weight: bold; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { text-align: left; color: var(--text-dim); font-size: 0.7rem; padding: 15px; border-bottom: 2px solid #333; text-transform: uppercase; }
        td { padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.85rem; }

        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1 id="viewTitle">Player Management</h1>
            <p id="viewSubtitle" style="color: var(--text-dim)">Gerencie seus atletas e temporadas</p>
        </div>
        <div style="display: flex; gap: 10px;">
            <button class="btn-main" onclick="showModal('modalPlayer')">+ NOVO JOGADOR</button>
            <button class="btn-main hidden" id="btnSeason" onclick="showModal('modalSeason')">+ NOVA TEMPORADA</button>
        </div>
    </header>

    <!-- Lista de Jogadores -->
    <div class="player-selector" id="playerList">
        <!-- Jogadores cadastrados aqui -->
    </div>

    <!-- Dashboard Principal -->
    <div id="mainDashboard" class="hidden">
        <div class="tabs-container" id="seasonTabs"></div>

        <div class="overall-summary">
            <h3 style="margin-top:0; font-size: 0.75rem; letter-spacing: 2px; color: var(--gold);">RESUMO GERAL</h3>
            <div style="display: flex; justify-content: space-around; text-align: center;">
                <div><span style="display:block; font-size:0.65rem; color:var(--text-dim)">JOGOS</span><b id="ovGames" style="font-size:1.5rem">0</b></div>
                <div><span style="display:block; font-size:0.65rem; color:var(--text-dim)">GOLS</span><b id="ovGoals" style="font-size:1.5rem">0</b></div>
                <div><span style="display:block; font-size:0.65rem; color:var(--text-dim)">ASSISTS</span><b id="ovAssists" style="font-size:1.5rem">0</b></div>
                <div><span style="display:block; font-size:0.65rem; color:var(--text-dim)">PARTICIPAÇÕES</span><b id="ovTotal" style="font-size:1.5rem">0</b></div>
            </div>
        </div>

        <div class="summary-grid" id="compSummary"></div>

        <div class="form-section">
            <input type="date" id="mDate">
            <input type="text" id="mT1" placeholder="Time A">
            <input type="text" id="mT2" placeholder="Time B">
            <input type="text" id="mScore" placeholder="Placar">
            <input type="text" id="mComp" placeholder="Competição">
            <input type="number" id="mG" placeholder="G">
            <input type="number" id="mA" placeholder="A">
            <button class="btn-main" onclick="addMatch()">SALVAR</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>DATA</th>
                    <th>COMPETIÇÃO</th>
                    <th>CONFRONTO</th>
                    <th>RESULTADO</th>
                    <th>G</th>
                    <th>A</th>
                </tr>
            </thead>
            <tbody id="matchTable"></tbody>
        </table>
    </div>
</div>

<!-- Modais -->
<div id="modalPlayer" class="modal">
    <div class="modal-content">
        <h2>Cadastrar Atleta</h2>
        <input type="text" id="pNameInput" placeholder="Nome do Jogador" style="margin-bottom:15px;">
        <input type="date" id="pBirthInput" style="margin-bottom:20px;">
        <button class="btn-main" style="width:100%" onclick="savePlayer()">SALVAR JOGADOR</button>
    </div>
</div>

<div id="modalSeason" class="modal">
    <div class="modal-content">
        <h2>Nova Temporada</h2>
        <input type="text" id="sNameInput" placeholder="Ex: Temporada 2026" style="margin-bottom:20px;">
        <button class="btn-main" style="width:100%" onclick="saveSeason()">CRIAR</button>
    </div>
</div>

<script>
    // State management
    let state = {
        players: [], // [{ name, birth, seasons: { '2026': [] } }]
        activePlayerIdx: null,
        activeSeason: null
    };

    window.onload = () => {
        const saved = localStorage.getItem('marechal_lott_v2');
        if(saved) {
            state = JSON.parse(saved);
            renderPlayerList();
            if(state.activePlayerIdx !== null) selectPlayer(state.activePlayerIdx);
        }
    };

    function save() { localStorage.setItem('marechal_lott_v2', JSON.stringify(state)); }

    function showModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal() { document.querySelectorAll('.modal').forEach(m => m.style.display = 'none'); }

    function savePlayer() {
        const name = document.getElementById('pNameInput').value;
        const birth = document.getElementById('pBirthInput').value;
        if(!name || !birth) return;

        state.players.push({ name, birth, seasons: {} });
        save();
        renderPlayerList();
        closeModal();
    }

    function renderPlayerList() {
        const list = document.getElementById('playerList');
        list.innerHTML = '';
        state.players.forEach((p, idx) => {
            const chip = document.createElement('div');
            chip.className = `player-chip ${idx === state.activePlayerIdx ? 'active' : ''}`;
            chip.innerHTML = `<h4>${p.name}</h4><span>${p.birth.split('-')[0]}</span>`;
            chip.onclick = () => selectPlayer(idx);
            list.appendChild(chip);
        });
    }

    function selectPlayer(idx) {
        state.activePlayerIdx = idx;
        const player = state.players[idx];
        document.getElementById('viewTitle').innerText = player.name;
        document.getElementById('btnSeason').classList.remove('hidden');
        document.getElementById('mainDashboard').classList.remove('hidden');
        
        // Auto-select first season if exists
        const seasonKeys = Object.keys(player.seasons);
        if(seasonKeys.length > 0 && !state.activeSeason) {
            state.activeSeason = seasonKeys[0];
        } else if (seasonKeys.length === 0) {
            state.activeSeason = null;
        }

        renderPlayerList();
        renderTabs();
        updateStats();
        save();
    }

    function saveSeason() {
        const name = document.getElementById('sNameInput').value;
        if(!name) return;
        const player = state.players[state.activePlayerIdx];
        if(!player.seasons[name]) player.seasons[name] = [];
        state.activeSeason = name;
        save();
        renderTabs();
        updateStats();
        closeModal();
    }

    function renderTabs() {
        const container = document.getElementById('seasonTabs');
        container.innerHTML = '';
        if(state.activePlayerIdx === null) return;
        const player = state.players[state.activePlayerIdx];
        Object.keys(player.seasons).forEach(s => {
            const t = document.createElement('div');
            t.className = `tab ${s === state.activeSeason ? 'active' : ''}`;
            t.innerText = s;
            t.onclick = () => { state.activeSeason = s; renderTabs(); updateStats(); save(); };
            container.appendChild(t);
        });
    }

    function addMatch() {
        if(!state.activeSeason) return alert("Crie uma temporada primeiro!");
        const match = {
            date: document.getElementById('mDate').value,
            t1: document.getElementById('mT1').value,
            t2: document.getElementById('mT2').value,
            score: document.getElementById('mScore').value,
            comp: document.getElementById('mComp').value.toUpperCase(),
            g: parseInt(document.getElementById('mG').value) || 0,
            a: parseInt(document.getElementById('mA').value) || 0
        };
        state.players[state.activePlayerIdx].seasons[state.activeSeason].push(match);
        save();
        updateStats();
        document.querySelectorAll('.form-section input').forEach(i => i.value = '');
    }

    function updateStats() {
        const table = document.getElementById('matchTable');
        const summary = document.getElementById('compSummary');
        table.innerHTML = '';
        summary.innerHTML = '';

        if(!state.activeSeason) return;
        
        let games = state.players[state.activePlayerIdx].seasons[state.activeSeason];
        
        // ORDEM CRESCENTE POR DATA
        games.sort((a, b) => new Date(a.date) - new Date(b.date));

        let ovG = 0, ovA = 0, ovJ = games.length;
        let comps = {};

        games.forEach(g => {
            ovG += g.g; ovA += g.a;
            if(!comps[g.comp]) comps[g.comp] = { j: 0, g: 0, a: 0 };
            comps[g.comp].j++; comps[g.comp].g += g.g; comps[g.comp].a += g.a;

            // FORMATO DIA/MES/ANO
            const d = g.date.split('-');
            const formattedDate = d.length === 3 ? `${d[2]}/${d[1]}/${d[0]}` : g.date;

            table.innerHTML += `
                <tr>
                    <td>${formattedDate}</td>
                    <td style="color:var(--gold)">${g.comp}</td>
                    <td>${g.t1} vs ${g.t2}</td>
                    <td>${g.score}</td>
                    <td>${g.g}</td>
                    <td>${g.a}</td>
                </tr>
            `;
        });

        document.getElementById('ovGames').innerText = ovJ;
        document.getElementById('ovGoals').innerText = ovG;
        document.getElementById('ovAssists').innerText = ovA;
        document.getElementById('ovTotal').innerText = ovG + ovA;

        Object.keys(comps).forEach(c => {
            summary.innerHTML += `
                <div class="summary-card">
                    <span style="font-size:0.65rem; color:var(--text-dim)">${c}</span>
                    <div style="display:flex; justify-content:space-between; margin-top:8px;">
                        <span>J: <b>${comps[c].j}</b></span>
                        <span>G: <b>${comps[c].g}</b></span>
                        <span>A: <b>${comps[c].a}</b></span>
                    </div>
                </div>
            `;
        });
    }
</script>
</body>
</html>
