<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics de Atletas | Marechal Lott</title>
    <style>
        :root {
            --bg-color: #121417;
            --card-bg: #1c1f24;
            --accent-green: #00cba9;
            --text-main: #ffffff;
            --text-dim: #94a3b8;
            --gold: #f59e0b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 950px;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.05);
        }

        /* Modais e Overlays */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 15px;
            width: 350px;
            border: 1px solid var(--accent-green);
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 20px;
        }

        .btn-action {
            background-color: var(--accent-green);
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-left: 10px;
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid var(--text-dim);
            color: var(--text-dim);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
        }

        /* Tabs/Temporadas */
        .season-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            overflow-x: auto;
            padding-bottom: 10px;
        }

        .season-tab {
            background: rgba(255,255,255,0.05);
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            white-space: nowrap;
            transition: 0.3s;
        }

        .season-tab.active {
            background: var(--gold);
            color: #000;
            font-weight: bold;
        }

        /* Inputs */
        input, select {
            width: 100%;
            background: #2a2e35;
            border: 1px solid #3f444e;
            color: white;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
            background: rgba(255,255,255,0.02);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        /* Tabela */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th {
            text-align: left;
            color: var(--text-dim);
            font-size: 0.8rem;
            padding: 12px;
            border-bottom: 1px solid #3f444e;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1 id="playerHeader">Nenhum Atleta</h1>
            <p id="ageHeader">Cadastre o jogador para iniciar.</p>
        </div>
        <div>
            <button class="btn-secondary" id="btnCadastrarJogador" onclick="openModal('modalAtleta')">Cadastrar Jogador</button>
            <button class="btn-action hidden" id="btnNovaTemporada" onclick="openModal('modalTemporada')">Nova Temporada</button>
        </div>
    </header>

    <!-- Painel de Temporadas -->
    <div id="mainPanel" class="hidden">
        <div class="season-tabs" id="seasonTabs">
            <!-- Abas de Temporada entram aqui -->
        </div>

        <div id="seasonContent">
            <div class="section-title" style="color: var(--text-dim); margin-bottom: 10px;">REGISTRAR JOGO NA TEMPORADA <span id="currentSeasonName"></span></div>
            <div class="form-grid">
                <input type="date" id="matchDate">
                <input type="text" id="team1" placeholder="Time A">
                <input type="text" id="team2" placeholder="Time B">
                <input type="text" id="score" placeholder="Placar">
                <input type="text" id="comp" placeholder="Competição">
                <input type="number" id="goals" placeholder="Gols">
                <input type="number" id="assists" placeholder="Assists">
                <button class="btn-action" onclick="addGame()">+ Salvar Jogo</button>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>DATA</th>
                        <th>COMPETIÇÃO</th>
                        <th>JOGO</th>
                        <th>PLACAR</th>
                        <th>G</th>
                        <th>A</th>
                    </tr>
                </thead>
                <tbody id="gameTableBody">
                    <!-- Jogos da temporada ativa -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Modal Cadastro Atleta -->
<div id="modalAtleta" class="modal">
    <div class="modal-content">
        <h3>Cadastrar Atleta</h3>
        <input type="text" id="nameInput" placeholder="Nome do Jogador">
        <input type="date" id="birthInput">
        <button class="btn-action" style="width: 100%" onclick="saveAtleta()">Finalizar Cadastro</button>
    </div>
</div>

<!-- Modal Nova Temporada -->
<div id="modalTemporada" class="modal">
    <div class="modal-content">
        <h3>Nome da Temporada</h3>
        <input type="text" id="seasonNameInput" placeholder="Ex: Temporada 2026 ou Europa">
        <button class="btn-action" style="width: 100%" onclick="saveSeason()">Criar Temporada</button>
    </div>
</div>

<script>
    let player = null;
    let seasons = {}; // Objeto para guardar jogos por temporada { "2026": [] }
    let activeSeason = null;

    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    function saveAtleta() {
        const name = document.getElementById('nameInput').value;
        const birth = document.getElementById('birthInput').value;
        if(!name || !birth) return;

        player = { name, birth };
        document.getElementById('playerHeader').innerText = name;
        
        const age = new Date().getFullYear() - new Date(birth).getFullYear();
        document.getElementById('ageHeader').innerText = `Nascido em ${birth.split('-')[0]} (${age} anos)`;
        
        document.getElementById('btnCadastrarJogador').classList.add('hidden');
        document.getElementById('btnNovaTemporada').classList.remove('hidden');
        document.getElementById('mainPanel').classList.remove('hidden');
        closeModal('modalAtleta');
    }

    function saveSeason() {
        const sName = document.getElementById('seasonNameInput').value;
        if(!sName || seasons[sName]) return;

        seasons[sName] = [];
        activeSeason = sName;
        renderTabs();
        renderGames();
        closeModal('modalTemporada');
    }

    function renderTabs() {
        const container = document.getElementById('seasonTabs');
        container.innerHTML = '';
        Object.keys(seasons).forEach(s => {
            const div = document.createElement('div');
            div.className = `season-tab ${s === activeSeason ? 'active' : ''}`;
            div.innerText = s;
            div.onclick = () => { activeSeason = s; renderTabs(); renderGames(); };
            container.appendChild(div);
        });
        document.getElementById('currentSeasonName').innerText = activeSeason;
    }

    function addGame() {
        if(!activeSeason) return alert("Crie ou selecione uma temporada primeiro!");
        
        const game = {
            date: document.getElementById('matchDate').value,
            t1: document.getElementById('team1').value,
            t2: document.getElementById('team2').value,
            score: document.getElementById('score').value,
            comp: document.getElementById('comp').value,
            g: document.getElementById('goals').value || 0,
            a: document.getElementById('assists').value || 0
        };

        seasons[activeSeason].push(game);
        renderGames();
        
        // Limpar campos
        document.querySelectorAll('.form-grid input').forEach(i => i.value = '');
    }

    function renderGames() {
        const tbody = document.getElementById('gameTableBody');
        tbody.innerHTML = '';
        if(!activeSeason) return;

        seasons[activeSeason].forEach(g => {
            tbody.innerHTML += `
                <tr>
                    <td>${g.date}</td>
                    <td style="color:var(--gold)">${g.comp}</td>
                    <td>${g.t1} vs ${g.t2}</td>
                    <td>${g.score}</td>
                    <td style="font-weight:bold">${g.g}</td>
                    <td style="font-weight:bold">${g.a}</td>
                </tr>
            `;
        });
    }
</script>

</body>
</html>
